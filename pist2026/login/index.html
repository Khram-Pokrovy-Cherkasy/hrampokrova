<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#ffffff">
    <title>Вхід до списків | Храм Покрова</title>
    <style>
        :root { color-scheme: light dark; }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #f6f6f6;
            color: #222;
        }
        .card {
            width: min(100%, 520px);
            padding: 32px 28px;
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgb(0 0 0 / 8%);
        }
        h1 { margin: 0 0 20px; font-size: 1.55rem; }
        p { line-height: 1.55; }
        .button {
            display: inline-block;
            margin-top: 12px;
            padding: 12px 22px;
            border-radius: 10px;
            background: #222;
            color: #fff;
            text-decoration: none;
            font-weight: 600;
            cursor: pointer;
            border: 0;
            font-size: 1rem;
        }
        .secondary {
            background: transparent;
            color: inherit;
            border: 1px solid #aaa;
        }
        #result { margin-top: 18px; }
        .hint { opacity: .72; font-size: .92rem; }
        @media (prefers-color-scheme: dark) {
            body { background: #171717; color: #eee; }
            .card { background: #242424; border-color: #444; box-shadow: none; }
            .button { background: #eee; color: #111; }
            .secondary { background: transparent; color: #eee; border-color: #777; }
        }
    </style>
</head>
<body>
    <main class="card">
        <h1>Доступ до списків імен</h1>
        <p>Для доступу до списків потрібно пройти аутентифікацію.</p>
        <p>Вкажіть email, дозволений для роботи з цим сервісом. На нього буде надіслано одноразовий код входу.</p>

        <button class="button" id="loginButton" type="button">Увійти</button>
        <a class="button secondary" href="/pist2026/">Повернутися</a>

        <div id="result" class="hint" aria-live="polite"></div>
    </main>

    <script>
        const API_LOGIN_URL = "/pist2026/api/?type=all";

        document.getElementById("loginButton").addEventListener("click", () => {
            const result = document.getElementById("result");
            result.textContent = "Відкриваємо захищений ресурс. Cloudflare Access покаже форму входу, якщо ви ще не авторизовані.";

            const loginWindow = window.open(API_LOGIN_URL, "_blank", "noopener");
            if (!loginWindow) {
                window.location.href = API_LOGIN_URL;
            }
        });
    </script>
</body>
</html>
